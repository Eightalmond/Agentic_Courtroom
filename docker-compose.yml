services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      # Next.js loads .env.local from this bind-mounted project directory.
      # Provider secrets are never passed as image build arguments.
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
